<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
        <style>
        table{
            border-collapse: collapse;
            width: 500px; 
            margin: 20px;
        }
        th,td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Registration Form</h1>

    <form>
        <label>First Name:</label>
        <input type="text" placeholder="Enter first name">
        <br><br>
        <label>Last Name:</label>
        <input type="text" placeholder="Enter last name">
        <br><br>
        <label>Email:</label>
        <input type="text" placeholder="Enter Email Address">
        <br><br>
        <label>Password:</label>
        <input type="text">
        <br><br>
        <tr>
            <td>Gender:</td>
            <br>
            <td>
                <labe><input type="radio" name="role">Male</label> <br>
                <labe><input type="radio" name="role">Female</label> <br>
                <labe><input type="radio" name="role">Other</label> <br>
            </td>
        </tr>
        <tr>
            <td>Age:</td>
            <td>
                <select>
                    <option></option>
                </select>
            </td>
        </tr>
        <br><br>
        <tr>
            <td>Preferences:</td><br>
            <td>
                <labe><input type="radio" name="role">Acrylic Painting</label> <br>
                <labe><input type="radio" name="role">Oil Painting</label> <br>
                <labe><input type="radio" name="role">Water Color Painting</label> <br>
            </td>
        </tr>
        <tr>
            <td>Select Occupation</td>
            <td>
                <select>
                    <option>Student</option>
                    <option>Teacher</option>    
                </select>
            </td>
        </tr>
        <br><br>
        <label>Bio:</label> 
        <textarea placeholder="Share few lines about yourself....."rows="10" cols="50"></textarea>
        
        <br><br>
        <tr>
            <td></td>
                <td>
                    <input type="submit" value="Login">
                    <input type="reset" value="reset">
                </td>
        </tr>

        
    </form>
</body>

</html>
