<body>
    <h2>KIỂM TRA MẬT KHẨU</h2>
    <label>Nhập mật khẩu:</label>
    <input type="password" id="matkhau">
    <br><br>
    <button onclick="kiemtra()">Kiểm tra</button>
    <p id="ketqua"></p>

    <script>
        function kiemtra() {
            let matkhau = document.getElementById("matkhau").value;

            if (matkhau.length >= 8) {
                document.getElementById("ketqua").innerHTML =
                    "Mật khẩu hợp lệ";
            } else {
                document.getElementById("ketqua").innerHTML =
                    "Mật khẩu quá ngắn";
            }
        }
    </script>
</body>
