<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>KIỂM TRA NĂM NHUẬN</h2>

    <label>Nhập năm:</label>
    <input type="number" id="nam">
    <br><br>

    <button onclick="kiemtra()">Kiểm tra</button>
    <p id="ketqua"></p>

    <script>
        function kiemtra() {
            let nam = Number(document.getElementById("nam").value);

            if (document.getElementById("nam").value === "" ||
                !Number.isInteger(nam) || nam <= 0) {
                document.getElementById("ketqua").innerHTML =
                    "Vui lòng nhập năm hợp lệ!";
            } else if (nam % 400 == 0 ||
                       (nam % 4 == 0 && nam % 100 != 0)) {
                document.getElementById("ketqua").innerHTML =
                    nam + " là năm nhuận";
            } else {
                document.getElementById("ketqua").innerHTML =
                    nam + " không phải năm nhuận";
            }
        }
    </script>
</body>
</html>
