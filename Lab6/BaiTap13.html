<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>CHƯƠNG TRÌNH CHUYỂN ĐỔI NHIỆT ĐỘ</h2>

    <label>Nhập nhiệt độ theo °C:</label>
    <input type="number" id="celsius">
    <br><br>

    <button onclick="chuyendo()">Chuyển đổi</button>
    <p id="ketqua"></p>

    <script>
        function chuyendo() {
            let c = document.getElementById("celsius").value;

            if (c === "") {
                document.getElementById("ketqua").innerHTML =
                    "Vui lòng nhập nhiệt độ!";
            } else {
                let f = (9 / 5) * Number(c) + 32;

                document.getElementById("ketqua").innerHTML =
                    "Nhiệt độ theo °F: " + f;
            }
        }
    </script>
</body>
</html>
