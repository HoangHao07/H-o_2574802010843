<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>CHƯƠNG TRÌNH TÍNH BMI</h2>

    <label>Nhập chiều cao (m):</label>
    <input type="number" id="chieucao" step="0.01">
    <br><br>

    <label>Nhập cân nặng (kg):</label>
    <input type="number" id="cannang" step="0.1">
    <br><br>

    <button onclick="tinhBMI()">Tính BMI</button>
    <p id="ketqua"></p>

    <script>
        function tinhBMI() {
            let h = Number(document.getElementById("chieucao").value);
            let w = Number(document.getElementById("cannang").value);

            if (document.getElementById("chieucao").value === "" ||
                document.getElementById("cannang").value === "" ||
                h <= 0 || w <= 0) {
                document.getElementById("ketqua").innerHTML =
                    "Vui lòng nhập chiều cao và cân nặng hợp lệ!";
            } else {
                let bmi = w / (h * h);
                let ketluan;

                if (bmi < 18.5) {
                    ketluan = "Gầy";
                } else if (bmi < 25) {
                    ketluan = "Bình thường";
                } else if (bmi < 30) {
                    ketluan = "Thừa cân";
                } else {
                    ketluan = "Béo phì";
                }

                document.getElementById("ketqua").innerHTML =
                    "Chỉ số BMI: " + bmi.toFixed(2) +
                    "<br>Kết luận: " + ketluan;
            }
        }
    </script>
</body>
</html>
