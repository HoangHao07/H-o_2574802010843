<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>CHƯƠNG TRÌNH XẾP LOẠI HỌC LỰC</h2>
    <label>Nhập điểm (0-100):</label>
    <input type="number" id="diem" min="0" max="100">
    <br><br>
    <button onclick="xeploai()">Xếp loại</button>
    <p id="ketqua"></p>
    <script>
        function xeploai() {
            let diem = Number(document.getElementById("diem").value);
            if (document.getElementById("diem").value === "" ||
                diem < 0 || diem > 100) {
                document.getElementById("ketqua").innerHTML = "Điểm không hợp lệ!";
            } else if (diem >= 90) {
                document.getElementById("ketqua").innerHTML = "Xếp loại A";
            } else if (diem >= 80) {
                document.getElementById("ketqua").innerHTML = "Xếp loại B";
            } else if (diem >= 70) {
                document.getElementById("ketqua").innerHTML = "Xếp loại C";
            } else if (diem >= 60) {
                document.getElementById("ketqua").innerHTML = "Xếp loại D";
            } else {
                document.getElementById("ketqua").innerHTML = "Xếp loại F";
            }
        }
    </script>
</body>
</html>
