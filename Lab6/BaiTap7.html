<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>XÚC XẮC MAY MẮN</h2>
    <button onclick="lacxucxac()">Lắc xúc xắc</button>
    <p id="ketqua"></p>
    <script>
        function lacxucxac() {
            let so = Math.floor(Math.random() * 6) + 1;
            document.getElementById("ketqua").innerHTML =
                "Kết quả: " + so;
        }
    </script>
</body>
</html>
